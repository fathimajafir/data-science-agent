[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-agent"
version = "1.0.0"
description = "Data science agent powered by tabular foundation models (TabPFN): classification, regression, forecasting, interpretation, and a tool-calling agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fathima Kunnummal" }]
keywords = [
    "tabular",
    "foundation-models",
    "tabpfn",
    "agent",
    "data-science",
    "forecasting",
    "interpretability",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tabpfn>=9,<10",
    "tabpfn-client>=0.7,<0.8",
    "tabpfn-extensions[interpretability]>=0.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
tabular-agent = "tabular_agent.cli:main"

[project.urls]
Repository = "https://github.com/fathimajafir/data-science-agent"
Issues = "https://github.com/fathimajafir/data-science-agent/issues"
Changelog = "https://github.com/fathimajafir/data-science-agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabular_agent = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["I"]
